name: Update Kodi webOS Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kodi-webos-nightly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repository metadata and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: "3"
        run: python3 scripts/update_repo.py

      - name: Commit generated metadata
        run: |
          if [ -z "$(git status --porcelain -- repo.json build-state.json)" ]; then
            echo "No metadata changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo.json build-state.json
          git commit -m "Update Kodi webOS nightly"
          git push